<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    /* ════════════════════════════════════════════════════
       BOUVET THEME  (soft "Designtilnærming" palette)
       Palette sampled from Bouvet's design-approach artwork:
       warm orange (primary accent), pale blue-grey, bright mint
       and cream — on warm paper, with near-black navy ink.
       Identity nod (Heydays / Red Dot): the "rounding" / circle.
       Design notes:
       - Generous whitespace; smaller base text; airy components.
       - Decorative shapes ALWAYS sit behind text (z-index) and
         hug the corners, so they never cover content.
       Reusable: same component classes as the Forest template,
       so any slides.md renders unchanged across both themes.
       ════════════════════════════════════════════════════ */

    :root {
      /* Bouvet "Designtilnærming" palette — sampled from the artwork.
         Variable NAMES are kept stable for the stylesheet below; their
         VALUES are the true image colors. Roles:
           skyink = primary accent (warm orange, the characters)
           sky    = calm structural fill (pale blue-grey panels)
           sand   = light orange fill   pink = soft peach   teal = mint */
      --c-ink:       #1a1a1a;   /* body text */
      --c-navy:      #14143a;   /* headings & dark panels (image near-black navy) */
      --c-bg:        #fbf9f5;   /* soft warm white */
      --c-cream:     #f0e4cc;   /* cream surface tint (image) */
      --c-white:     #ffffff;
      --c-sky:       #c0ccd8;   /* pale blue-grey — signature calm fill (image) */
      --c-skyink:    #c96f2e;   /* legible deep orange — PRIMARY accent */
      --c-sand:      #f0a86c;   /* light orange fill (image characters) */
      --c-pink:      #f4b48c;   /* soft peach (harmonizing warm) */
      --c-teal:      #78fc9c;   /* bright mint (image) */
      --c-muted:     #6c7a86;
      --c-line:      #e8e0d2;   /* warm hairline */

      /* legacy aliases so shared component rules resolve */
      --c-deep:      var(--c-ink);
      --c-heading:   var(--c-navy);
      --c-accent:    var(--c-skyink);
      --c-bright:    var(--c-skyink);
      --c-surface:   #ffffff;

      --radius:      16px;
      --shadow:      0 6px 26px rgba(30,60,90,0.08);
      --font-main:   'Inter', sans-serif;
      --font-head:   'Space Grotesk', 'Inter', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
    }

    /* ── Base (smaller text + more air than the green theme) ── */
    .reveal-viewport { background: var(--c-bg); }

    .reveal {
      font-family: var(--font-main);
      font-size: 30px;          /* was 36 — smaller, airier */
      font-weight: 400;
      color: var(--c-ink);
      line-height: 1.6;
    }

    .reveal .slides { text-align: left; }

    /* keep real content above any decorative pseudo-elements / figures */
    .reveal .slides > section > *:not(.bv-corner):not(.bv-scene) { position: relative; z-index: 2; }

    /* ── Headings ── */
    .reveal h1, .reveal h2, .reveal h3, .reveal h4 {
      font-family: var(--font-head);
      font-weight: 700;
      color: var(--c-navy);
      text-transform: none;
      letter-spacing: -0.02em;
      line-height: 1.12;
      margin-bottom: 0.55em;     /* more space under headings */
    }

    .reveal h1 { font-size: 1.95em; }
    .reveal h2 { font-size: 1.4em; }
    .reveal h3 { font-size: 1.1em; color: var(--c-skyink); }

    /* ── Title slide (first section) ── */
    /* Full height so a bv-center scene anchors to the whole slide
       (bottom third), not just the short text block. */
    .reveal .slides > section:first-child {
      text-align: left;
      height: 100%;
      display: flex; flex-direction: column; justify-content: center;
    }
    .reveal .slides > section:first-child h1 {
      font-size: 2.3em;
      color: var(--c-navy);
    }
    .reveal .slides > section:first-child p {
      color: var(--c-muted);
      font-size: 0.72em;
      font-weight: 500;
    }
    /* Title slide: decoration comes from a <div class="bv-scene"> in the
       markdown (a real illustration), not abstract circles. */

    /* ── Body text ── */
    .reveal p { line-height: 1.6; margin: 0 0 0.6em; }

    /* ── Lists (roomier) ── */
    .reveal ul, .reveal ol { display: block; margin: 0 0 0 1.2em; }

    .reveal ul li {
      list-style: none;
      position: relative;
      padding-left: 1.4em;
      margin-bottom: 0.6em;       /* more space between bullets */
      line-height: 1.5;
    }
    /* bullet = a small "rounding" (ring) echoing the O */
    .reveal ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.42em;
      width: 0.5em;
      height: 0.5em;
      background: transparent;
      border: 3px solid var(--c-skyink);
      border-radius: 50%;
    }

    .reveal ol li { margin-bottom: 0.6em; line-height: 1.5; }
    .reveal ol li::marker { color: var(--c-skyink); font-weight: 700; }

    /* ── Code ── */
    .reveal code {
      font-family: var(--font-mono);
      background: var(--c-cream);
      color: var(--c-navy);
      padding: 0.05em 0.3em;
      border-radius: 6px;
      font-size: 0.85em;
    }
    .reveal pre {
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
    }
    .reveal pre code {
      background: transparent; padding: 0; border-radius: 0;
      font-size: 0.75em; line-height: 1.5;
    }

    /* ── Blockquote ── */
    .reveal blockquote {
      background: var(--c-white);
      border-left: 6px solid var(--c-sky);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 0.9em 1.3em;
      font-family: var(--font-head);
      font-style: normal;
      font-weight: 600;
      color: var(--c-navy);
      box-shadow: var(--shadow);
      width: 100%;
    }

    /* ── Links ── */
    .reveal a {
      color: var(--c-skyink);
      text-decoration: none;
      border-bottom: 2px solid var(--c-sky);
    }

    /* ── Generic two-column ── */
    .reveal .cols {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2.2em; align-items: start;
    }

    /* ── Image placeholder ── */
    .reveal .img-placeholder {
      background: var(--c-white);
      border: 2px dashed var(--c-sky);
      border-radius: var(--radius);
      padding: 2em; text-align: center;
      color: var(--c-muted); font-size: 0.7em; font-weight: 600;
    }

    /* ── Kicker / eyebrow label (pill) ── */
    .reveal .kicker {
      display: inline-block;
      font-family: var(--font-head);
      font-size: 0.42em;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--c-skyink);
      background: rgba(201,111,46,0.12);
      padding: 0.45em 0.95em;
      border-radius: 999px;
      margin: 0 0 0.7em;
    }

    /* ── Heading accent rule: short sky bar under content h2 ── */
    .reveal section:not(.section-header):not(.closing):not(:first-child) h2 {
      position: relative;
      padding-bottom: 0.32em;
    }
    .reveal section:not(.section-header):not(.closing):not(:first-child) h2::after {
      content: '';
      position: absolute;
      left: 0; bottom: 0;
      width: 1.6em; height: 5px;
      background: var(--c-sky);
      border-radius: 999px;
    }

    /* ── Lead line ── */
    .reveal .lead {
      font-family: var(--font-head);
      font-size: 1.1em; font-weight: 600;
      color: var(--c-navy); line-height: 1.4;
    }

    /* ── Stat callouts (more air) ── */
    .reveal .stats { display: flex; gap: 1.2em; margin: 0.6em 0 1.1em; }
    .reveal .stat {
      flex: 1;
      background: var(--c-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.85em 0.6em;
      text-align: center;
      border-top: 5px solid var(--c-sky);
    }
    .reveal .stat:nth-child(2) { border-top-color: var(--c-sand); }
    .reveal .stat:nth-child(3) { border-top-color: var(--c-pink); }
    .reveal .stat:nth-child(4) { border-top-color: var(--c-teal); }
    .reveal .stat .num {
      display: block;
      font-family: var(--font-head);
      font-size: 1.8em; font-weight: 700;
      color: var(--c-navy); line-height: 1;
    }
    .reveal .stat .label {
      display: block; font-size: 0.5em; font-weight: 500;
      color: var(--c-muted); margin-top: 0.6em;
    }

    /* ── Card grid (more air) ── */
    .reveal .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.1em; margin: 0.6em 0;
    }
    .reveal .cards.two { grid-template-columns: 1fr 1fr; }
    .reveal .card {
      background: var(--c-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-left: 5px solid var(--c-sky);
      padding: 0.85em 1.1em;
    }
    .reveal .cards .card:nth-child(2) { border-left-color: var(--c-sand); }
    .reveal .cards .card:nth-child(3) { border-left-color: var(--c-pink); }
    .reveal .cards .card:nth-child(4) { border-left-color: var(--c-teal); }
    .reveal .card h4 { margin: 0 0 0.35em; font-size: 0.82em; color: var(--c-navy); }
    .reveal .card p, .reveal .card ul { font-size: 0.66em; margin: 0; }
    .reveal .card ul { margin-left: 0.9em; }
    .reveal .card ul li { margin-bottom: 0.25em; }
    .reveal .card ul li::before { top: 0.35em; width: 0.4em; height: 0.4em; border-width: 2px; }

    /* ── Pyramid: light→dark, navy text on light fills, white on navy ── */
    .reveal .pyramid {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; margin: 0.7em 0 0.7em;
    }
    .reveal .pyramid .tier {
      font-family: var(--font-head); font-weight: 600;
      font-size: 0.66em; text-align: center;
      padding: 0.55em 0.8em; border-radius: 10px;
    }
    /* Warm sequential ramp: light sand at the top → deep navy foundation.
       Cohesive with the theme (sand/orange family + navy), no clashing hues. */
    .reveal .pyramid .t1 { width: 42%; background: #f7dcb4; color: var(--c-navy); }
    .reveal .pyramid .t2 { width: 56%; background: #f2bd82; color: var(--c-navy); }
    .reveal .pyramid .t3 { width: 70%; background: #ee9f55; color: var(--c-navy); }
    .reveal .pyramid .t4 { width: 84%; background: var(--c-skyink); color: var(--c-white); }
    .reveal .pyramid .t5 { width: 98%; background: var(--c-navy);   color: var(--c-white); }
    /* Mini pyramid: small, centered — for the per-layer slides. Mark the
       active tier normally and add class "dim" to the others to grey them out,
       so the focused layer stands out in its real pyramid colour. */
    .reveal .pyramid.bv-mini { max-width: 360px; margin: 1.6em auto 0; gap: 5px; }
    .reveal .pyramid.bv-mini .tier { font-size: 0.42em; padding: 0.4em 0.6em; }
    .reveal .pyramid .tier.dim { background: #e3ded4; color: #ada490; }

    /* ── Process flow (more air) ── */
    .reveal .flow {
      display: flex; align-items: stretch; flex-wrap: wrap;
      gap: 0; margin: 0.7em 0 0.9em;
    }
    .reveal .flow .step {
      flex: 1; min-width: 0;
      background: var(--c-white);
      box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 0.7em 0.65em;
      font-size: 0.58em; font-weight: 500;
      text-align: center; line-height: 1.35;
      display: flex; flex-direction: column; justify-content: center;
    }
    .reveal .flow .step + .step { margin-left: 1.6em; position: relative; }
    .reveal .flow .step + .step::before {
      content: '→';
      position: absolute; left: -1.2em; top: 50%;
      transform: translateY(-50%);
      color: var(--c-skyink); font-weight: 800; font-size: 1.2em;
    }

    /* ── Contrast / from → to ── */
    .reveal .contrast {
      display: grid; grid-template-columns: 1fr auto 1fr;
      gap: 1.1em; align-items: center; margin: 0.7em 0;
    }
    .reveal .contrast .panel { border-radius: var(--radius); padding: 0.9em 1.1em; }
    .reveal .contrast .panel.from { background: var(--c-cream); border: 1px solid var(--c-line); }
    .reveal .contrast .panel.to   { background: #e7f4ee; border: 1px solid #bce6d4; }
    .reveal .contrast .panel h4 { margin: 0 0 0.4em; font-size: 0.8em; }
    .reveal .contrast .panel.from h4 { color: var(--c-muted); }
    .reveal .contrast .panel.to h4   { color: #2f8f63; }
    .reveal .contrast .panel p, .reveal .contrast .panel ul { font-size: 0.66em; margin: 0; }
    .reveal .contrast .panel ul { margin-left: 0.9em; }
    .reveal .contrast .panel ul li { margin-bottom: 0.22em; }
    .reveal .contrast .panel.from ul li::before { border-color: var(--c-muted); }
    .reveal .contrast .panel.to ul li::before { border-color: #2f8f63; }
    .reveal .contrast .arrow {
      font-size: 1.6em; font-weight: 800; color: var(--c-skyink); text-align: center;
    }

    /* ── Loop (2×2 cycle) ── */
    .reveal .loop {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1.1em; margin: 0.7em auto 0.6em; max-width: 84%;
    }
    .reveal .loop .node {
      background: var(--c-white);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 0.8em 1em;
    }
    .reveal .loop .node .n {
      display: inline-block; font-family: var(--font-head); font-weight: 700;
      color: var(--c-white); background: var(--c-skyink);
      width: 1.6em; height: 1.6em; line-height: 1.6em;
      text-align: center; border-radius: 50%; font-size: 0.6em;
    }
    .reveal .loop .node:nth-child(2) .n { background: var(--c-navy); }
    .reveal .loop .node:nth-child(3) .n { background: var(--c-teal); color: var(--c-navy); }
    .reveal .loop .node:nth-child(4) .n { background: var(--c-sand); color: var(--c-navy); }
    .reveal .loop .node p { font-size: 0.62em; margin: 0.35em 0 0; }

    /* ── Timeline / maturity stages ── */
    .reveal .timeline { display: flex; gap: 0; margin: 0.8em 0 0.8em; }
    .reveal .timeline .stage { flex: 1; padding-right: 1.1em; position: relative; }
    .reveal .timeline .stage .dot {
      display: block; width: 1em; height: 1em; border-radius: 50%;
      background: var(--c-skyink); margin-bottom: 0.6em;
      position: relative; z-index: 1;
    }
    .reveal .timeline .stage:nth-child(2) .dot { background: var(--c-navy); }
    .reveal .timeline .stage:nth-child(3) .dot { background: var(--c-teal); }
    .reveal .timeline .stage:nth-child(4) .dot { background: var(--c-sand); }
    .reveal .timeline .stage::before {
      content: ''; position: absolute; top: 0.45em; left: 0.5em; right: 0;
      height: 3px; background: var(--c-line);
    }
    .reveal .timeline .stage:last-child::before { display: none; }
    .reveal .timeline .stage h4 { margin: 0 0 0.25em; font-size: 0.74em; }
    .reveal .timeline .stage p { margin: 0; font-size: 0.56em; color: var(--c-muted); line-height: 1.4; }

    /* ── Tables ── */
    .reveal table {
      width: 100%; border-collapse: collapse; font-size: 0.66em; margin: 0.5em 0;
      background: var(--c-white); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow);
    }
    .reveal table th {
      background: var(--c-navy); color: var(--c-white);
      text-align: left; padding: 0.6em 0.85em; font-family: var(--font-head); font-weight: 600;
    }
    .reveal table td {
      padding: 0.5em 0.85em; border-bottom: 1px solid var(--c-line); vertical-align: top;
    }
    .reveal table tr:nth-child(even) td { background: #faf6ef; }

    /* ── Section header slide ──
       On-theme soft gradient backdrop (cool blue-grey → warm cream), with a
       SMALLER centered navy "card" holding the heading. A figure goes below it
       via <div class="bv-scene bv-center"> in the markdown. */
    .reveal section.section-header {
      /* full-bleed gradient comes from Reveal's slide background
         (data-background-gradient on the slide); box itself is transparent */
      background: transparent;
      height: 100%;
      /* !important beats Reveal's inline display:block on the active section */
      display: flex !important;
      flex-direction: column; justify-content: center; align-items: center;
      overflow: hidden;
    }
    .reveal section.section-header h2 {
      color: var(--c-white);
      background: var(--c-navy);
      font-size: 1.6em;
      text-align: center;
      max-width: 68%;
      margin: 0 0 0.4em;
      padding: 0.7em 1.1em;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    /* lift the card slightly above center so the figure sits clearly beneath it */
    .reveal section.section-header { padding-bottom: 4%; }

    /* ── Closing slide ── */
    .reveal section.closing {
      background: var(--c-navy);
      border-radius: var(--radius);
      height: 100%;
      display: flex; flex-direction: column; justify-content: center;
      text-align: center; overflow: hidden;
    }
    .reveal section.closing h2 { color: var(--c-white); font-size: 1.9em; }
    .reveal section.closing p { color: #cdd7e0; }
    .reveal section.closing strong { color: var(--c-sand); }
    /* Decoration on the closing slide comes from a centered <div class="bv-scene bv-center">
       in the markdown — kept in the bottom third so it never covers the text. */

    /* ── Bouvet figures (geometric decorations; SVG sprite lives in <body>) ──
       Use anywhere:  inline → <svg class="bv-fig" style="width:160px"><use href="#bv-tree"/></svg>
                      corner  → <div class="bv-corner bv-br"><svg class="bv-fig"><use href="#bv-tree"/></svg></div>
       Corner figures sit BEHIND text (z-index 0) and are anchored hard into
       the slide corner — clear of the text column — so they never overlap copy.
       Reveal's default margin (0.12) leaves an empty band around content; the
       negative offsets park the figure in that band / slightly off-slide. */
    .reveal svg.bv-fig {
      display: inline-block; vertical-align: middle;
      width: 120px; height: 120px;
    }
    .reveal .bv-corner {
      position: absolute; z-index: 0; pointer-events: none;
      width: 150px; height: 150px;
    }
    .reveal .bv-corner svg.bv-fig { width: 100%; height: 100%; }
    /* push into the empty margin band, away from the text column */
    .reveal .bv-br { right: -64px; bottom: -40px; }
    .reveal .bv-bl { left: -64px;  bottom: -40px; }
    .reveal .bv-tr { right: -64px; top: -40px; }
    .reveal .bv-tl { left: -64px;  top: -40px; }
    /* size variants for corner figures */
    .reveal .bv-corner.bv-sm { width: 96px; height: 96px; }
    .reveal .bv-corner.bv-lg { width: 210px; height: 210px; }
    /* on dark (navy) slides, give figures a touch more presence */
    .reveal section.section-header .bv-corner,
    .reveal section.closing .bv-corner { opacity: 0.95; }

    /* ── Scene: a larger illustration cluster for slides with room
       (title / section / closing). Place as a direct child of the slide:
       <div class="bv-scene bv-right">
         <svg class="bv-fig" style="width:200px"><use href="#bv-hills"/></svg>
         <svg class="bv-fig" style="width:120px"><use href="#bv-tree"/></svg>
       </div>
       Sits behind text (z-index 0). bv-right anchors to the right edge,
       bv-left to the left; figures align along the bottom. */
    .reveal .bv-scene {
      position: absolute; z-index: 0; pointer-events: none;
      bottom: -30px; display: flex; align-items: flex-end; gap: 12px;
    }
    .reveal .bv-scene.bv-right { right: -30px; }
    .reveal .bv-scene.bv-left  { left: -30px; }
    .reveal .bv-scene svg.bv-fig { width: 150px; height: 150px; }
    /* Centered scene for low-content slides (title / section / closing):
       sits in the bottom third, centered horizontally, clear of the text. */
    .reveal .bv-scene.bv-center {
      left: 50%; transform: translateX(-50%);
      bottom: 6%; right: auto;
      justify-content: center;
    }

    /* ── Chrome ── */
    .reveal .controls {
      color: var(--c-skyink);
      transform: scale(0.5);          /* navigation arrows at half size */
      transform-origin: bottom right;
    }

    /* Custom thin progress bar: a line at the very bottom that fills
       left→right across the deck, full width on the last slide.
       Replaces Reveal's built-in progress bar (disabled in init). */
    .bv-progress {
      position: fixed; left: 0; bottom: 0;
      width: 100%; height: 5px;
      background: var(--c-line);
      z-index: 60;
    }
    .bv-progress .bv-progress-fill {
      height: 100%; width: 0;
      background: var(--c-skyink);
      transition: width 0.4s ease;
    }

    /* Small Bouvet wordmark tucked into the top-left corner of every slide.
       Fixed to the viewport so it sits in Reveal's empty margin band (clear of
       content) and stays put across slides. Recoloured to the theme's deep
       orange via currentColor so it blends into the palette. */
    .deck-logo {
      position: fixed; top: 22px; left: 26px;
      z-index: 60;
      color: var(--c-navy);
      opacity: 0.92;
      pointer-events: none;
    }
    .deck-logo svg { height: 22px; width: auto; display: block; }
  </style>
</head>
<body>
  <!-- ════════════════════════════════════════════════════
       BOUVET FIGURE SPRITE
       Geometric decorations in the "Designtilnærming" style:
       quarter-circles, rectangles, squares, triangles and flat
       circles. Heads use TWO DOT-EYES ONLY — no mouths.
       Palette: orange #f0a86c, deep-orange #c96f2e,

  <!-- Custom thin progress line that fills across the deck -->
  <div class="bv-progress"><div class="bv-progress-fill"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: false,
      progress: false,          /* using the custom .bv-progress bar instead */
      transition: 'fade',
      backgroundTransition: 'fade',
      center: false,
      margin: 0.12,
      plugins: [RevealMarkdown, RevealNotes, RevealHighlight]
    });

    // Drive the custom progress line: fill = current slide / last slide,
    // reaching 100% on the final slide.
    (function () {
      var fill = document.querySelector('.bv-progress-fill');
      function update() {
        var total = Reveal.getTotalSlides();
        var idx = Reveal.getSlidePastCount();       // 0-based index of current slide
        var pct = total > 1 ? (idx / (total - 1)) * 100 : 100;
        fill.style.width = pct + '%';
      }
      Reveal.on('ready', update);
      Reveal.on('slidechanged', update);
    })();
  </script>
