<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --c-bg:        #f5f7f0;
      --c-deep:      #1a2e1a;
      --c-heading:   #2d6a4f;
      --c-accent:    #52b788;
      --c-bright:    #7bc67e;
      --c-surface:   #e9f5ee;
      --c-muted:     #6a8f6a;
      --c-white:     #ffffff;
      --radius:      12px;
      --font-main:   'Nunito', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
    }

    /* ── Base ── */
    .reveal-viewport { background: var(--c-bg); }

    .reveal {
      font-family: var(--font-main);
      font-size: 36px;
      font-weight: 400;
      color: var(--c-deep);
    }

    .reveal .slides { text-align: left; }

    /* ── Headings ── */
    .reveal h1, .reveal h2, .reveal h3, .reveal h4 {
      font-family: var(--font-main);
      font-weight: 800;
      color: var(--c-heading);
      text-transform: none;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.4em;
    }

    .reveal h1 { font-size: 2em; }
    .reveal h2 { font-size: 1.5em; }
    .reveal h3 { font-size: 1.15em; color: var(--c-accent); }

    /* ── Title slide (first section) ── */
    .reveal .slides > section:first-child {
      text-align: center;
    }
    .reveal .slides > section:first-child h1 {
      font-size: 2.2em;
      color: var(--c-heading);
    }
    .reveal .slides > section:first-child p {
      color: var(--c-muted);
      font-size: 0.75em;
      font-weight: 600;
    }

    /* ── Body text ── */
    .reveal p {
      line-height: 1.6;
      margin: 0 0 0.5em;
    }

    /* ── Lists ── */
    .reveal ul, .reveal ol {
      display: block;
      margin: 0 0 0 1.2em;
    }

    .reveal ul li {
      list-style: none;
      position: relative;
      padding-left: 1.2em;
      margin-bottom: 0.45em;
      line-height: 1.5;
    }

    .reveal ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 0.5em;
      height: 0.5em;
      background: var(--c-bright);
      border-radius: 50%;
    }

    .reveal ol li { margin-bottom: 0.45em; line-height: 1.5; }

    /* ── Code ── */
    .reveal code {
      font-family: var(--font-mono);
      background: var(--c-surface);
      color: var(--c-heading);
      padding: 0.05em 0.3em;
      border-radius: 6px;
      font-size: 0.85em;
    }

    .reveal pre {
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
    }

    .reveal pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: 0.75em;
      line-height: 1.5;
    }

    /* ── Blockquote ── */
    .reveal blockquote {
      background: var(--c-surface);
      border-left: 5px solid var(--c-bright);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 0.8em 1.2em;
      font-style: normal;
      font-weight: 600;
      color: var(--c-heading);
      box-shadow: none;
      width: 100%;
    }

    /* ── Links ── */
    .reveal a {
      color: var(--c-accent);
      text-decoration: none;
      border-bottom: 2px solid var(--c-bright);
    }

    /* ── Two-column layout: use <div class="cols"> ── */
    .reveal .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2em;
      align-items: start;
    }

    /* ── Image placeholder ── */
    .reveal .img-placeholder {
      background: var(--c-surface);
      border: 2px dashed var(--c-accent);
      border-radius: var(--radius);
      padding: 2em;
      text-align: center;
      color: var(--c-muted);
      font-size: 0.7em;
      font-weight: 600;
    }

    /* ── Kicker / eyebrow label above headings ── */
    .reveal .kicker {
      display: block;
      font-size: 0.42em;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c-accent);
      margin: 0 0 0.2em;
    }

    /* ── Heading accent rule (content slides only) ── */
    .reveal section:not(.section-header):not(.closing):not(:first-child) h2 {
      padding-bottom: 0.2em;
      border-bottom: 4px solid var(--c-surface);
    }

    /* ── Lead emphasis line ── */
    .reveal .lead {
      font-size: 1.1em;
      font-weight: 700;
      color: var(--c-heading);
      line-height: 1.4;
    }

    /* ── Stat callouts: <div class="stats"><div class="stat">… ── */
    .reveal .stats {
      display: flex;
      gap: 1em;
      margin: 0.3em 0 0.8em;
    }
    .reveal .stat {
      flex: 1;
      background: var(--c-surface);
      border-radius: var(--radius);
      padding: 0.6em 0.5em;
      text-align: center;
    }
    .reveal .stat .num {
      display: block;
      font-size: 1.7em;
      font-weight: 800;
      color: var(--c-heading);
      line-height: 1;
    }
    .reveal .stat .label {
      display: block;
      font-size: 0.5em;
      font-weight: 600;
      color: var(--c-muted);
      margin-top: 0.5em;
    }

    /* ── Card grid: <div class="cards"> / .cards.two ── */
    .reveal .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.9em;
      margin: 0.3em 0;
    }
    .reveal .cards.two { grid-template-columns: 1fr 1fr; }
    .reveal .card {
      background: var(--c-surface);
      border-radius: var(--radius);
      border-top: 4px solid var(--c-accent);
      padding: 0.6em 0.85em;
    }
    .reveal .card h4 {
      margin: 0 0 0.25em;
      font-size: 0.8em;
      color: var(--c-heading);
    }
    .reveal .card p,
    .reveal .card ul { font-size: 0.66em; margin: 0; }
    .reveal .card ul { margin-left: 0.9em; }
    .reveal .card ul li { margin-bottom: 0.2em; }

    /* ── Pyramid: <div class="pyramid"><div class="tier t1">… ── */
    .reveal .pyramid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 0.4em 0 0.5em;
    }
    .reveal .pyramid .tier {
      color: var(--c-white);
      font-weight: 700;
      font-size: 0.66em;
      text-align: center;
      padding: 0.5em 0.8em;
      border-radius: 8px;
    }
    .reveal .pyramid .t1 { width: 42%; background: var(--c-bright); color: var(--c-deep); }
    .reveal .pyramid .t2 { width: 56%; background: var(--c-accent); }
    .reveal .pyramid .t3 { width: 70%; background: #3f9b73; }
    .reveal .pyramid .t4 { width: 84%; background: var(--c-heading); }
    .reveal .pyramid .t5 { width: 98%; background: var(--c-deep); }

    /* ── Horizontal process flow: <div class="flow"><div class="step">… ── */
    .reveal .flow {
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 0;
      margin: 0.4em 0 0.7em;
    }
    .reveal .flow .step {
      flex: 1;
      min-width: 0;
      background: var(--c-surface);
      border-radius: 10px;
      padding: 0.55em 0.6em;
      font-size: 0.58em;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .reveal .flow .step + .step { margin-left: 1.5em; position: relative; }
    .reveal .flow .step + .step::before {
      content: '→';
      position: absolute;
      left: -1.15em;
      top: 50%;
      transform: translateY(-50%);
      color: var(--c-accent);
      font-weight: 800;
      font-size: 1.2em;
    }

    /* ── Contrast / from→to: <div class="contrast"> .panel.from .arrow .panel.to ── */
    .reveal .contrast {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.9em;
      align-items: center;
      margin: 0.4em 0;
    }
    .reveal .contrast .panel {
      border-radius: var(--radius);
      padding: 0.7em 0.95em;
    }
    .reveal .contrast .panel.from { background: #f6e8e6; border: 1px solid #e2b5ad; }
    .reveal .contrast .panel.to   { background: var(--c-surface); border: 1px solid var(--c-bright); }
    .reveal .contrast .panel h4 { margin: 0 0 0.35em; font-size: 0.78em; }
    .reveal .contrast .panel.from h4 { color: #b04a3c; }
    .reveal .contrast .panel.to h4   { color: var(--c-heading); }
    .reveal .contrast .panel p,
    .reveal .contrast .panel ul { font-size: 0.66em; margin: 0; }
    .reveal .contrast .panel ul { margin-left: 0.9em; }
    .reveal .contrast .panel ul li { margin-bottom: 0.18em; }
    .reveal .contrast .arrow {
      font-size: 1.5em;
      font-weight: 800;
      color: var(--c-accent);
      text-align: center;
    }

    /* ── Loop diagram (2×2 cycle): <div class="loop"><div class="node"> ── */
    .reveal .loop {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9em;
      margin: 0.4em auto 0.5em;
      max-width: 82%;
    }
    .reveal .loop .node {
      background: var(--c-surface);
      border-left: 4px solid var(--c-accent);
      border-radius: var(--radius);
      padding: 0.6em 0.85em;
    }
    .reveal .loop .node .n {
      display: inline-block;
      font-weight: 800;
      color: var(--c-white);
      background: var(--c-accent);
      width: 1.5em;
      height: 1.5em;
      line-height: 1.5em;
      text-align: center;
      border-radius: 50%;
      font-size: 0.6em;
    }
    .reveal .loop .node p { font-size: 0.62em; margin: 0.3em 0 0; }

    /* ── Timeline / maturity stages: <div class="timeline"><div class="stage"> ── */
    .reveal .timeline {
      display: flex;
      gap: 0;
      margin: 0.5em 0 0.6em;
    }
    .reveal .timeline .stage {
      flex: 1;
      padding-right: 1em;
      position: relative;
    }
    .reveal .timeline .stage .dot {
      display: block;
      width: 0.9em;
      height: 0.9em;
      border-radius: 50%;
      background: var(--c-accent);
      margin-bottom: 0.5em;
      position: relative;
      z-index: 1;
    }
    .reveal .timeline .stage::before {
      content: '';
      position: absolute;
      top: 0.4em;
      left: 0.45em;
      right: 0;
      height: 3px;
      background: var(--c-bright);
    }
    .reveal .timeline .stage:last-child::before { display: none; }
    .reveal .timeline .stage h4 { margin: 0 0 0.2em; font-size: 0.72em; }
    .reveal .timeline .stage p { margin: 0; font-size: 0.56em; color: var(--c-muted); line-height: 1.35; }

    /* ── Tables ── */
    .reveal table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.68em;
      margin: 0.3em 0;
    }
    .reveal table th {
      background: var(--c-heading);
      color: var(--c-white);
      text-align: left;
      padding: 0.45em 0.7em;
      font-weight: 700;
    }
    .reveal table td {
      padding: 0.4em 0.7em;
      border-bottom: 1px solid #d9e8df;
      vertical-align: top;
    }
    .reveal table tr:nth-child(even) td { background: var(--c-surface); }

    /* ── Section header slide: add class="section-header" to section ── */
    .reveal section.section-header {
      background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%);
      border-radius: var(--radius);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .reveal section.section-header h2 {
      color: var(--c-white);
      font-size: 2em;
      text-align: center;
    }

    /* ── Closing slide ── */
    .reveal section.closing {
      text-align: center;
    }
    .reveal section.closing h2 {
      font-size: 2em;
    }

    /* ── Progress bar ── */
    .reveal .progress { color: var(--c-bright); }

    /* ── Slide number ── */
    .reveal .slide-number {
      font-family: var(--font-main);
      font-size: 0.5em;
      color: var(--c-muted);
      background: transparent;
    }

    /* ── Controls ── */
    .reveal .controls { color: var(--c-accent); }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown
               data-separator="^\n---\n$"
               data-separator-vertical="^\n--\n$"
               data-separator-notes="^Note:">
        <script type="text/template">
<!-- SLIDES_CONTENT -->
        </script>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      progress: true,
      transition: 'fade',
      backgroundTransition: 'fade',
      center: false,
      margin: 0.08,
      plugins: [RevealMarkdown, RevealNotes, RevealHighlight]
    });
  </script>
</body>
</html>
